      d="M72 56
         H184
         C197.25 56 208 66.75 208 80
         V132
         C208 145.25 197.25 156 184 156
         H124
         L72 200
         L92 156
         H72
         C58.75 156 48 145.25 48 132
         V80
         C48 66.75 58.75 56 72 56Z"
    />

    <!-- the V of Verba -->
    <path d="M96 84 L128 130 L160 84"/>
  </g>

  <!-- Simbolo AI: solo contorno, verde salvia come nel marchio -->
  <path
    d="M200 26
       C202 26 202 31 204 33
       C206 35 211 35 211 37
       C211 39 206 39 204 41
       C202 43 202 48 200 48
       C198 48 198 43 196 41
       C194 39 189 39 189 37
       C189 35 194 35 196 33
       C198 31 198 26 200 26Z"
    fill="none"
    stroke="#829F68"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
