<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 256 256"
  fill="none"
  role="img"
  aria-labelledby="icon-title icon-desc"
>
  <title id="icon-title">Verba — app icon</title>
  <desc id="icon-desc">
    Bolla di parlato con la V di Verba e scintilla AI, disegnati a contorni
    nello stesso stile del marchio Marc'Antonio Lopez: line art su sfondo
    trasparente, trattouniforme con cap tondi, scintilla in verde salvia.
  </desc>

  <g
    fill="none"
    stroke="#242629"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- speech bubble, tail bottom-left -->
