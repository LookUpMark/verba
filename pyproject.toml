[project]
name = "verba"
version = "0.2.0"
description = "Local-first AI language learning — structured courses, tutor and drills on your own local LLM"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
verba = "verba.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verba"]
