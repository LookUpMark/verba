name: Release

# Builds the installers (macOS DMG arm64+x64, Windows NSIS, Linux AppImage/DEB)
# and attaches them to a draft GitHub Release. Each job runs on its native OS:
# the PyInstaller sidecar and the Tauri shell are built for the host platform.
# The tag must match pyproject.toml version (v0.1.0 <-> "0.1.0").
# workflow_dispatch (no tag) = build-only dry run, nothing published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # release create/upload — the only job in the repo with write access

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          WANT="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag $TAG != pyproject.toml version $WANT"
            exit 1
          fi

      - name: Read version
        id: ver
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Verba ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  build:
    needs: create-release
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS arm64 only for v0.1.0: PyInstaller cannot cross-compile the
          # sidecar, and the hosted runners are arm64. Intel macOS needs a
          # Rosetta x86_64 sidecar build — planned for v0.2.
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          WANT="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag $TAG != pyproject.toml version $WANT"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Pinned PyInstaller: reproducible sidecar builds (osusume pattern).
      - name: Build sidecar (PyInstaller)
        run: pip install -e . "pyinstaller==6.22.3" && python desktop/build-sidecar.py

      - name: Import macOS signing certificate (optional)
        if: runner.os == 'MacOS' && env.MACOS_CERTIFICATE != ''
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo -n "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT_PATH" -k "$KC" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC"

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.settings.args }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the draft release
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
