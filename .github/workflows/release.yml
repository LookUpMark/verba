name: Release

# Builds the installers (macOS DMG arm64+x64, Windows NSIS, Linux AppImage/DEB)
# and attaches them to a draft GitHub Release. Each job runs on its native OS:
# the PyInstaller sidecar and the Tauri shell are built for the host platform.
# The tag must match pyproject.toml version (v0.1.0 <-> "0.1.0").
# workflow_dispatch (no tag) = build-only dry run, nothing published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # release create/upload — the only job in the repo with write access

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          WANT="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag $TAG != pyproject.toml version $WANT"
            exit 1
          fi

      - name: Read version
        id: ver
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Verba ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          # Hand-written narrative notes (maintained per release in the repo),
          # with the auto changelog appended by the action.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

  build:
    needs: create-release
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Each macOS build runs on its native runner: macos-latest (arm64)
          # and macos-15 (from macOS 15 the plain label is the Intel x86_64
          # machine; arm64 has the explicit -arm64 suffix) — the PyInstaller
          # sidecar cannot cross-compile, so no Rosetta tricks are needed.
          # The old macos-13 label is retired: jobs queued on it forever.
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-15
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          WANT="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag $TAG != pyproject.toml version $WANT"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.os == 'macos-latest' && 'aarch64-apple-darwin' || (matrix.settings.os == 'macos-15' && 'x86_64-apple-darwin' || '') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Pinned PyInstaller: reproducible sidecar builds (osusume pattern).
      - name: Build whisper.cpp (bundled STT)
        run: |
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp desktop/build/whisper-src
          cmake -S desktop/build/whisper-src -B desktop/build/whisper-build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DGGML_BUILD_TESTS=OFF
          cmake --build desktop/build/whisper-build --config Release --target whisper-cli

      - name: Build sidecar (PyInstaller)
        run: pip install -e . -c constraints.txt pytest && python -m pytest -q && pip install "pyinstaller==6.22.3" && python desktop/build-sidecar.py

      - name: Import macOS signing certificate (optional)
        if: runner.os == 'MacOS' && env.MACOS_CERTIFICATE != ''
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo -n "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT_PATH" -k "$KC" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC"

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.settings.args }}

  publish-release:
    needs: build
    # The header documents workflow_dispatch as build-only: without this
    # guard a dry run published the draft too (github.ref_name on a branch
    # is the branch name).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the release is complete, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$ASSETS" | grep -q "latest.json" || { echo "::error::updater manifest latest.json missing"; exit 1; }
          echo "$ASSETS" | grep -qE '\.sig$' || { echo "::error::no signed (.sig) updater artifacts attached"; exit 1; }
          gh release edit "$TAG" --draft=false
