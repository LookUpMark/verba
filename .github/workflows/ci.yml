name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + tooling
        # Pinned toolchain via constraints: same versions as the desktop job
        # and the release, so the lint/build verdict is reproducible.
        run: pip install -e . -c constraints.txt ruff pyinstaller pytest

      - name: Lint
        run: ruff check src tests

      - name: Tests
        env:
          VERBA_LLM_SPAWN: "0"
        run: python -m pytest -q

      - name: Sidecar smoke build
        run: python desktop/build-sidecar.py

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri-build validates bundle.externalBin even for cargo check:
      # the sidecar binary must exist before the shell compiles.
      - name: Build sidecar (PyInstaller)
        run: pip install -e . "pyinstaller==6.22.3" && python desktop/build-sidecar.py

      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked
